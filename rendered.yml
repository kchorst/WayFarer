name: Rendered QA Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Rendered traveler acceptance
        run: python tests/release-rendered.py --no-write
      - name: Rendered canonical hostile matrix
        run: python tests/release-rendered-matrix-all.py --no-write
