name: Development Gate

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: wayfinder-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Source qualification gates
        run: npm run check
