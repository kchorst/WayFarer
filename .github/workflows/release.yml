name: Frozen Windows Release Gate

on:
  workflow_dispatch:

concurrency:
  group: wayfinder-frozen-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Require main branch
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Frozen traveler qualification may only run from main.'
          }
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Source gates
        run: npm run check
      - name: Regenerate rendered evidence for this exact source
        run: |
          python tests/release-rendered.py
          python tests/release-rendered-matrix-all.py
      - name: Stage exact candidate and package manifest
        run: node scripts/stage-release.mjs
      - name: Create exact candidate ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\WAYFINDER -DestinationPath dist\WAYFINDER-CANDIDATE.zip -CompressionLevel Optimal
      - name: Hash exact candidate ZIP
        shell: pwsh
        run: (Get-FileHash dist\WAYFINDER-CANDIDATE.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content dist\zip.sha256 -Encoding ascii
      - name: Native Windows lifecycle on exact ZIP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows-lifecycle-native.ps1 -ZipPath dist\WAYFINDER-CANDIDATE.zip -EvidenceOut dist\windows-evidence.json
      - name: Clean extract exact ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\exact | Out-Null
          Expand-Archive -Path dist\WAYFINDER-CANDIDATE.zip -DestinationPath dist\exact -Force
      - name: Read-only exact-package gates
        shell: pwsh
        run: |
          cd dist\exact\WAYFINDER
          npm run package:verify
          python tests\release-rendered.py --no-write
          python tests\release-rendered-matrix-all.py --no-write
      - name: Independent Release Manager gate
        shell: pwsh
        run: |
          $hash=(Get-Content dist\zip.sha256).Trim()
          $env:WAYFINDER_WINDOWS_EVIDENCE=(Resolve-Path dist\windows-evidence.json).Path
          $env:WAYFINDER_EXACT_ZIP_SHA256=$hash
          cd dist\exact\WAYFINDER
          node release-gate.mjs
      - name: Machine qualification certificate
        shell: pwsh
        run: |
          $hash=(Get-Content dist\zip.sha256).Trim()
          $release=Get-Content -Raw dist\exact\WAYFINDER\RELEASE.json | ConvertFrom-Json
          $windows=Get-Content -Raw dist\windows-evidence.json | ConvertFrom-Json
          $certificate=[ordered]@{
            schemaVersion=1
            verdict='READY_FOR_USER_ACCEPTANCE'
            releaseId=$release.releaseId
            exactZipSha256=$hash
            criticalHash=$windows.criticalHash
            packageManifestSha256=$windows.packageManifestSha256
            commit='${{ github.sha }}'
            workflowRun='${{ github.run_id }}'
            qualifiedAt=(Get-Date).ToUniversalTime().ToString('o')
          }
          $certificate | ConvertTo-Json | Set-Content dist\QUALIFICATION.json -Encoding UTF8
      - name: Publish traveler artifact only after every gate above passes
        uses: actions/upload-artifact@v7
        with:
          name: WAYFINDER-WINDOWS-QUALIFIED
          path: |
            dist/WAYFINDER-CANDIDATE.zip
            dist/QUALIFICATION.json
            dist/windows-evidence.json
            dist/zip.sha256
          if-no-files-found: error
