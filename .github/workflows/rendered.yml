name: Rendered QA Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: wayfinder-rendered-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Rendered traveler acceptance
        run: python tests/release-rendered.py --no-write
      - name: Rendered canonical hostile matrix
        run: python tests/release-rendered-matrix-all.py --no-write
